[workspace]
resolver = "3"
members = [
    "crates/telos-types",
    "crates/telos-listener",
    "crates/telos-settler",
    "crates/telos-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["psyto <saito.hiroyuki@gmail.com>"]
license = "MIT"
repository = "https://github.com/psyto/telos"
rust-version = "1.85"

[workspace.dependencies]
telos-types = { path = "crates/telos-types" }
telos-listener = { path = "crates/telos-listener" }
telos-settler = { path = "crates/telos-settler" }

alloy = { version = "1.0", features = ["full"] }
revm = { version = "38", features = ["alloydb"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
